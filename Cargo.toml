[package]
name = "wez-ai-sidebar"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "WezTerm-native sidebar for monitoring AI coding agents"
license = "MIT"
repository = "https://github.com/ryou09269639/wez-ai-sidebar"
keywords = ["wezterm", "tui", "ai", "cli", "monitoring"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "6.0"
libc = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.12", features = ["v4"] }

[dev-dependencies]
tempfile = "3.15"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
